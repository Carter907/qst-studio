name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-amd64
          - os: windows-latest
            platform: windows-amd64
          - os: macos-latest
            platform: darwin-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux WebKitGTK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Ensure NSIS is installed on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsisCmd = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $nsisCmd) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe"
            )
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $found) {
              choco install nsis -y --no-progress
              $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
            if (-not $found) {
              throw "makensis.exe could not be found after installing NSIS"
            }
            (Split-Path -Parent $found) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Sync wails.json version from Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            node -e '
              const fs = require("fs");
              const cfg = JSON.parse(fs.readFileSync("wails.json", "utf8"));
              cfg.info = cfg.info || {};
              cfg.info.productVersion = process.argv[1];
              fs.writeFileSync("wails.json", JSON.stringify(cfg, null, 2) + "\n");
            ' "$TAG_VER"
          fi

      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wails build -clean
          mkdir -p dist-release staging
          cp build/bin/qst-studio LICENSE README.md staging/
          tar -czf "dist-release/qst-studio-${{ matrix.platform }}.tar.gz" -C staging .

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          makensis -VERSION
          wails build -clean -nsis -v 2
          New-Item -ItemType Directory -Force -Path dist-release, staging | Out-Null
          Copy-Item build/bin/qst-studio-amd64-installer.exe dist-release/qst-studio-windows-amd64-installer.exe
          Copy-Item build/bin/qst-studio.exe, LICENSE, README.md staging/
          Compress-Archive -Path staging\* -DestinationPath "dist-release/qst-studio-${{ matrix.platform }}.zip"

      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          wails build -clean -platform darwin/universal
          mkdir -p dist-release
          ditto -c -k --sequesterRsrc --keepParent build/bin/qst-studio.app "dist-release/qst-studio-${{ matrix.platform }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
